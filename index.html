    <!-- Fonts: Geist self-hosted. The Google Fonts <link> was render-blocking
         (~750ms) and chained a second request to fonts.gstatic.com before any
         text could paint. Serving the two subsets we actually use from our own
         origin removes both the block and the extra connection; the @font-face
         rules are inlined so the browser sees them in the first byte of HTML.
         All four weights share one variable file per subset, exactly as Google
         serves them. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/geist-latin.woff2" crossorigin />
    <style>
      /* latin */
      @font-face {
        font-family: 'Geist';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/geist-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
          U+FEFF, U+FFFD;
      }

        font-weight: 500;

        font-weight: 400;
        font-display: swap;

    <!-- Preload the hero image early. Mirrors the <picture> candidate set so
         the preload and the render pick the same file - previously the full
         1536px asset was fetched for a ~640px slot. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      imagesrcset="/images/hero-640.webp 640w, /images/hero-960.webp 960w, /images/hero-1280.webp 1280w, /images/hero.webp 1536w"
      imagesizes="(min-width: 640px) 564px, calc(100vw - 2.75rem)"
      fetchpriority="high"
    />
